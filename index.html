<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blood Donor - Enroll</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between" x-data="enrollApp()">

  <!-- Toast Notification -->
  <div x-show="toastMessage" x-transition.opacity class="fixed bottom-5 right-5 z-50 bg-gray-900 text-white px-4 py-2 rounded-lg shadow-lg text-sm flex items-center gap-2">
    <span>✅</span> <span x-text="toastMessage"></span>
  </div>

  <!-- Header -->
  <header class="bg-red-600 text-white shadow-md">
    <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-lg font-bold flex items-center gap-2">🩸 Donor Enrollment</h1>      
    </div>
  </header>

  <!-- Main Form Container -->
  <main class="max-w-3xl w-full mx-auto p-4 my-6">
    <div class="bg-white rounded-xl shadow-md p-6 sm:p-8">
      <h2 class="text-2xl font-bold text-red-600 mb-6">Register New Blood Donor</h2>
      
      <form @submit.prevent="submitForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Full Name *</label>
          <input type="text" x-model="form.fullName" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Address</label>
          <textarea x-model="form.address" rows="3" placeholder="Enter street, area, or building details..." class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none resize-y"></textarea>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Pincode</label>
          <input type="text" x-model="form.pincode" placeholder="Postal Code" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Blood Group *</label>
            <select x-model="form.bloodGroup" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none bg-white">
              <option value="">Select Blood Group</option>
              <template x-for="bg in bloodGroups">
                <option :value="bg" x-text="bg"></option>
              </template>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Gender</label>
            <select x-model="form.gender" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none bg-white">
              <option value="">Select Gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Mobile Number *</label>
            <input type="tel" x-model="form.mobile" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">WhatsApp Number</label>
            <input type="tel" x-model="form.whatsapp" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Date of Birth *</label>
            <input type="date" x-model="form.dob" @change="calculateAge" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Calculated Age</label>
            <input type="text" x-model="form.age" readonly class="w-full px-3 py-2 border bg-gray-100 rounded-lg text-gray-500 cursor-not-allowed">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Available to Donate</label>
            <select x-model="form.available" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none bg-white">
              <option value="Yes">Yes</option>
              <option value="No">No</option>
              <option value="Temporarily Unavailable">Temporarily Unavailable</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Last Blood Donation Date</label>
            <input type="date" x-model="form.lastDonation" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Preferred Contact Method</label>
            <select x-model="form.contactMethod" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none bg-white">
              <option value="Call">Call</option>
              <option value="WhatsApp">WhatsApp</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Consent to Share Contact</label>
            <select x-model="form.consent" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none bg-white">
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Remarks</label>
          <input type="text" x-model="form.remarks" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none" placeholder="Optional notes">
        </div>

        <button type="submit" :disabled="loading" class="w-full bg-red-600 text-white font-bold py-3 rounded-lg hover:bg-red-700 transition duration-200 mt-4 disabled:opacity-50">
          <span x-show="!loading">Submit Registration</span>
          <span x-show="loading">Saving directly to Google Sheet...</span>
        </button>
      </form>
    </div>
  </main>

  <footer class="text-center py-6 text-xs text-gray-400">Blood Donor Community Portal &copy; 2026</footer>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyEzMAI-5enIfiJ3Co6R8uheF7EUeHG5jIRzFJG3h9VoTzk49jZmP1J-y4RhdF7etziFg/exec"; // <-- Paste your deployed Web App URL here

    function enrollApp() {
      return {
        bloodGroups: ['A+', 'A-', 'B+', 'B-', 'O+', 'O-', 'AB+', 'AB-'],
        form: {
          fullName: '', address: '', pincode: '', bloodGroup: '',
          mobile: '', whatsapp: '', dob: '', age: '', gender: '',
          available: 'Yes', lastDonation: '', contactMethod: 'Call',
          remarks: '', consent: 'Yes'
        },
        loading: false,
        toastMessage: '',

        showToast(msg) {
          this.toastMessage = msg;
          setTimeout(() => { this.toastMessage = ''; }, 3000);
        },

        calculateAge() {
          if (!this.form.dob) return;
          const dobDate = new Date(this.form.dob);
          const today = new Date();
          let age = today.getFullYear() - dobDate.getFullYear();
          const m = today.getMonth() - dobDate.getMonth();
          if (m < 0 || (m === 0 && today.getDate() < dobDate.getDate())) age--;
          this.form.age = age >= 0 ? age : '';
        },

        async submitForm() {
          this.loading = true;
          if (APPS_SCRIPT_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") {
            alert("Please paste your Google Apps Script Web App URL into 'APPS_SCRIPT_URL'!");
            this.loading = false;
            return;
          }

          try {
            await fetch(APPS_SCRIPT_URL, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.form)
            });
            
            this.showToast('Donor successfully registered & saved to sheet!');
            this.form = {
              fullName: '', address: '', pincode: '', bloodGroup: '',
              mobile: '', whatsapp: '', dob: '', age: '', gender: '',
              available: 'Yes', lastDonation: '', contactMethod: 'Call',
              remarks: '', consent: 'Yes'
            };
          } catch (err) {
            alert('Error submitting form: ' + err.message);
          } finally {
            this.loading = false;
          }
        }
      }
    }
  </script>
</body>
</html>
